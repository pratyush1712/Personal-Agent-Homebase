  #              gpt-4.1-mini, o4-mini, qwen3-30b-a3b, qwen2.5-coder-32b, glm-4.7]
  #
  #   sk-free:
  #     budget: $0.10/day
  #     models: [glm-4.7-flash, glm-4.5-flash, gpt-4.1-nano, qwen3-30b-a3b]
