# =============================================================================
# Production VPS overlay
# =============================================================================
# Public traffic enters through Caddy. LiteLLM and Mem0 remain bound to loopback
# for operator health checks and SSH tunnels. LiteLLM uses Neon, while Mem0 keeps
# vector data in Qdrant and lightweight API history in its Docker volume.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ACME_AGREE: "true"
    networks:
      - openagent-net
    depends_on:
      litellm:
        condition: service_started
      mem0:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  litellm:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PROXY_BASE_URL: ${PROXY_BASE_URL:-https://litellm.pratyushsudhakar.com}
      PROXY_LOGOUT_URL: ${PROXY_LOGOUT_URL:-https://litellm.pratyushsudhakar.com/ui}
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"

  mem0:
    ports:
      - "127.0.0.1:${MEM0_PORT:-8000}:8000"

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
