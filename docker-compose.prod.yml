# =============================================================================
# Production VPS overlay
# =============================================================================
# Public traffic enters through Caddy. LiteLLM and Mem0 remain bound to loopback
# for operator health checks and SSH tunnels. LiteLLM uses Neon, while Mem0 keeps
# vector data in Qdrant and lightweight API history in its Docker volume.
#
# Observability layer (new):
#   - uptime-kuma  → status.pratyushsudhakar.com  (uptime dashboard)
#   - loki         → log aggregation backend (internal only)
#   - promtail     → Docker log collector, ships to Loki
#   - grafana      → grafana.pratyushsudhakar.com  (log viewer)

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ACME_AGREE: "true"
    networks:
      - openagent-net
    depends_on:
      litellm:
        condition: service_started
      mem0:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  litellm:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PROXY_BASE_URL: ${PROXY_BASE_URL:-https://litellm.pratyushsudhakar.com}
      PROXY_LOGOUT_URL: ${PROXY_LOGOUT_URL:-https://litellm.pratyushsudhakar.com/ui}
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"

  mem0:
    ports:
      - "127.0.0.1:${MEM0_PORT:-8000}:8000"

  # ── Uptime Kuma ─────────────────────────────────────────────────────────────
  uptime-kuma:
    build:
      context: ./uptime-kuma
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - openagent-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3001 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ── Loki (log store) ────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.4
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - openagent-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ── Promtail (Docker log collector → Loki) ──────────────────────────────────
  promtail:
    image: grafana/promtail:3.4
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./config/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - openagent-net
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  # ── Grafana (log viewer) ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN:-pratyushsudhakar.com}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
    networks:
      - openagent-net
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 200M

networks:
  openagent-net:
    driver: bridge

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  uptime_kuma_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
