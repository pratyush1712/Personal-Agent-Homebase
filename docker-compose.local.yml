# =============================================================================
# Local development overlay
# =============================================================================
# Exposes service ports on 127.0.0.1 for fast local OpenCode/OpenAgent use.

services:
  litellm:
    environment:
      DATABASE_URL: ${LOCAL_DATABASE_URL:-postgresql://openagent:openagent@postgres:5432/openagent}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"

  mem0:
    ports:
      - "127.0.0.1:${MEM0_PORT:-8000}:8000"

  postgres:
    image: ankane/pgvector:v0.5.1
    restart: unless-stopped
    shm_size: "256mb"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openagent}
      POSTGRES_USER: ${POSTGRES_USER:-openagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openagent}
    networks:
      - openagent-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$${POSTGRES_USER:-openagent}" -d "$${POSTGRES_DB:-openagent}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-55432}:5432"

  qdrant:
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"

volumes:
  postgres_data:
    driver: local
