# =============================================================================
# Promtail — Docker log collector
# =============================================================================
# Scrapes all running Docker container logs via the Docker socket and ships
# them to Loki with labelling by container name and compose service.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: status
            values: [running]
    relabel_configs:
      # Container name without the leading slash
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"

      # Compose service name (set by docker compose)
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"

      # Compose project name
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "project"

      # stdout vs stderr
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "logstream"
