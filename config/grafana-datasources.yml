# =============================================================================
# Grafana — provisioned Loki datasource
# =============================================================================
# Automatically configures Loki as the default datasource on first startup.
# No manual UI step required. Volume-mounted at:
#   /etc/grafana/provisioning/datasources/loki.yml

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    version: 1
    editable: true
    jsonData:
      maxLines: 1000
